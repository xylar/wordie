[workspace]
name = "wordie"
channels = ["conda-forge"]
# No win-64. Nothing that ships is OS-specific -- the artifact is a static
# site built on Linux -- and the pipeline that is coming leans on the GDAL
# stack, which is where Windows support would actually cost something.
platforms = ["linux-64", "osx-64", "osx-arm64"]

# Node lives in pixi so that a checkout needs pixi and nothing else. The web app
# keeps its own package.json and lockfile under web/ -- pixi supplies the
# runtime, npm resolves the JavaScript.
#
# There is no Python here yet. It arrives with the pipeline that derives the
# ice shelf outlines from BedMachine, as its own feature and environment; the
# two share no dependency, so keeping them disjoint means a Node upgrade cannot
# perturb the Python solve.
[feature.web.dependencies]
nodejs = ">=20"

[environments]
default = ["web"]

[feature.web.tasks]
# `npm ci` rather than `npm install`: it installs exactly what the lockfile
# pins and fails if package.json has drifted from it, which is what both CI and
# a fresh worktree want.
install = { cmd = "npm ci", cwd = "web" }
dev = { cmd = "npm run dev", cwd = "web" }
build = { cmd = "npm run build", cwd = "web" }
preview = { cmd = "npm run preview", cwd = "web" }
fmt = { cmd = "npm run fmt", cwd = "web" }
fmt-check = { cmd = "npm run fmt-check", cwd = "web" }
typecheck = { cmd = "npm run typecheck", cwd = "web" }
test = { cmd = "npm run test", cwd = "web" }
check = { depends-on = ["fmt-check", "typecheck", "test", "build"] }
