<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordie — guess the Antarctic ice shelf</title>
    <meta
      name="description"
      content="Guess the Antarctic ice shelf from its outline."
    />
    <!-- Drawn from the Wordie Ice Shelf outline by `wordie-data logo`. Vite
         resolves this to a content-hashed asset at build time. -->
    <link rel="icon" href="./src/assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main id="app">
      <header>
        <!-- The mark is the Wordie Ice Shelf itself, drawn from the same file
             the answers come from. `alt` carries the name, so the heading is
             still text to anything that cannot see it. -->
        <h1>
          <img
            class="wordmark"
            src="./src/assets/banner.svg"
            alt="wordie"
            width="678"
            height="256"
          />
        </h1>
        <p class="tagline">Guess the Antarctic ice shelf from its outline.</p>
      </header>

      <!-- Fixed aspect ratio so the shape never stretches: scale is withheld
           from the player, distortion is not. -->
      <figure class="shelf">
        <svg viewBox="0 0 100 100" role="img" aria-label="Ice shelf outline">
          <path id="outline" fill-rule="evenodd" />
        </svg>
        <figcaption id="reveal"></figcaption>
      </figure>

      <form id="guess-form" autocomplete="off">
        <label class="visually-hidden" for="guess-input">
          Name an ice shelf
        </label>
        <input
          id="guess-input"
          type="text"
          placeholder="Name an ice shelf…"
          aria-describedby="remaining"
          aria-autocomplete="list"
          aria-controls="suggestions"
        />
        <ul
          id="suggestions"
          role="listbox"
          aria-label="Matching ice shelves"
        ></ul>
      </form>

      <p id="remaining" class="remaining" aria-live="polite"></p>
      <ol id="guesses" class="guesses"></ol>
      <p id="status" class="status" aria-live="polite"></p>
      <p class="share-row">
        <button id="share" type="button" hidden>Copy result</button>
      </p>

      <footer>
        <p>
          Outlines from
          <a href="https://nsidc.org/data/nsidc-0756"
            >BedMachine Antarctica v4</a
          >
          and
          <a href="https://nsidc.org/data/nsidc-0709"
            >MEaSUREs Antarctic Boundaries v2</a
          >. Distances are geodesic; arrows point as a polar stereographic map
          does.
        </p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
